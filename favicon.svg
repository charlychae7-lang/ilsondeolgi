<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15864f"/>
      <stop offset="1" stop-color="#0a4d2e"/>
    </linearGradient>
  </defs>
  <!-- 배경: 소생 초록 -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- 쌓인 일(업무 카드) : 위의 두 장은 덜어내어 옆으로 밀려남 -->
  <rect x="268" y="96" width="156" height="52" rx="26" fill="#d4f94e" opacity=".35"/>
  <rect x="236" y="168" width="188" height="52" rx="26" fill="#d4f94e" opacity=".6"/>
  <!-- 남은 한 장 : 앱 카드 -->
  <rect x="88" y="252" width="336" height="164" rx="44" fill="#f5f3ec"/>
  <!-- 완료 체크(일 덜기 완료) -->
  <circle cx="176" cy="334" r="42" fill="#d4f94e"/>
  <path d="M154 335l17 17 32-36" fill="none" stroke="#0a4d2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 카드 안 텍스트 줄 -->
  <rect x="244" y="312" width="132" height="18" rx="9" fill="#0f6b40"/>
  <rect x="244" y="344" width="86" height="18" rx="9" fill="#0f6b40" opacity=".35"/>
  <!-- 덜어내는 화살표 -->
  <path d="M120 150c0-30 22-52 52-52h28" fill="none" stroke="#d4f94e" stroke-width="16" stroke-linecap="round"/>
  <path d="M184 76l28 22-28 22" fill="none" stroke="#d4f94e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
